<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Suivi">
<meta name="theme-color" content="#ffffff">
<title>Mon Suivi Calories</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8fa; --surface:#fff; --surface2:#f1f3f6;
    --primary:#00c264; --primary-dark:#00a854; --primary-light:#e6f8ee;
    --text:#1a2332; --text-muted:#8a93a3; --text-light:#b4bac6;
    --border:#eef0f4; --danger:#ff5b5b; --orange:#ff7e3f;
    --radius:20px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  html{height:100%;}
  body{
    background:linear-gradient(160deg,#f0fbf5 0%,#f7f8fa 35%,#fff6f0 100%);
    color:var(--text);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100dvh; font-weight:600;
    padding-top:var(--safe-top); padding-bottom:calc(24px + var(--safe-bottom));
  }
  .header{ padding:24px 20px 4px; }
  .header-greeting{ font-size:13px; color:var(--text-muted); font-weight:700; margin-bottom:4px; }
  .header h1{ font-size:26px; font-weight:800; }

  .card{
    background:var(--surface); border-radius:var(--radius);
    padding:20px; margin:14px 16px 0;
    box-shadow:0 2px 12px rgba(0,0,0,0.04);
  }

  /* Ring */
  .ring-wrap{ display:flex; flex-direction:column; align-items:center; padding:8px 0 0; }
  .ring-container{ position:relative; width:200px; height:200px; }
  .ring-svg{ width:200px; height:200px; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--surface2); stroke-width:16; }
  .ring-fill{ fill:none; stroke:var(--primary); stroke-width:16; stroke-linecap:round;
    transition:stroke-dashoffset .8s cubic-bezier(.34,1.56,.64,1), stroke .3s; }
  .ring-fill.over{ stroke:var(--danger); }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-value{ font-size:38px; font-weight:900; line-height:1; }
  .ring-label{ font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-top:6px; }

  .cal-breakdown{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:18px; padding-top:16px; border-top:1px solid var(--border); }
  .cal-break{ text-align:center; }
  .cal-break-label{ font-size:10px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .cal-break-value{ font-size:19px; font-weight:800; }
  .cal-break-value.eaten{ color:var(--orange); }
  .cal-break-value.burned{ color:var(--primary); }

  /* Add buttons */
  .add-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 16px 0; }
  .add-btn{
    border:none; border-radius:16px; padding:16px 8px;
    font-family:'Nunito',sans-serif; font-size:15px; font-weight:800;
    cursor:pointer; transition:transform .15s;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .add-btn:active{ transform:scale(.95); }
  .add-btn .ic{ font-size:24px; }
  .add-btn.eat{ background:#fff1e8; color:var(--orange); }
  .add-btn.burn{ background:var(--primary-light); color:var(--primary-dark); }

  /* Motivation card */
  .motiv-card{ display:flex; align-items:center; gap:14px; }
  .motiv-emoji{ font-size:34px; flex-shrink:0; }
  .motiv-text{ font-size:14px; font-weight:700; color:var(--text); line-height:1.35; }
  .motiv-sub{ font-size:12px; color:var(--text-muted); font-weight:700; margin-top:2px; }

  /* Week bars */
  .week-row{ display:flex; justify-content:space-between; align-items:flex-end; height:80px; margin-top:14px; gap:6px; }
  .week-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .week-bar{ width:100%; max-width:26px; border-radius:6px 6px 3px 3px; background:var(--surface2); transition:height .5s ease; min-height:4px; }
  .week-bar.pos{ background:linear-gradient(180deg,var(--primary),var(--primary-dark)); }
  .week-bar.neg{ background:linear-gradient(180deg,#ffb0b0,var(--danger)); }
  .week-bar.today{ box-shadow:0 0 0 2px var(--text) inset; }
  .week-lbl{ font-size:10px; color:var(--text-muted); font-weight:700; margin-top:6px; text-transform:uppercase; }

  /* Entries list */
  .card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .card-title{ font-size:15px; font-weight:800; }
  .empty-state{ text-align:center; padding:20px 0 6px; color:var(--text-light); font-size:13px; font-weight:700; }
  .entry{
    display:flex; align-items:center; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .entry:last-child{ border-bottom:none; }
  .entry-ic{
    width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .entry-ic.eat{ background:#fff1e8; }
  .entry-ic.burn{ background:var(--primary-light); }
  .entry-mid{ flex:1; min-width:0; }
  .entry-title{ font-size:14px; font-weight:800; }
  .entry-time{ font-size:11px; color:var(--text-muted); font-weight:700; }
  .entry-cal{ font-size:15px; font-weight:800; flex-shrink:0; }
  .entry-cal.eat{ color:var(--orange); }
  .entry-cal.burn{ color:var(--primary-dark); }
  .entry-del{ background:none; border:none; color:var(--text-light); font-size:18px; padding:4px 2px; cursor:pointer; flex-shrink:0; }

  /* Modal */
  .modal-bg{
    position:fixed; inset:0; background:rgba(20,25,35,.45);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:200;
  }
  .modal-bg.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--surface); width:100%; max-width:480px;
    border-radius:24px 24px 0 0; padding:22px 20px calc(24px + var(--safe-bottom));
    transform:translateY(20px); transition:transform .25s;
  }
  .modal-bg.show .modal{ transform:translateY(0); }
  .modal-title{ font-size:18px; font-weight:800; margin-bottom:4px; }
  .modal-sub{ font-size:12px; color:var(--text-muted); font-weight:700; margin-bottom:16px; }
  .modal input[type=number]{
    width:100%; background:var(--surface2); border:2px solid transparent;
    border-radius:14px; padding:16px; font-family:'Nunito',sans-serif;
    font-size:22px; font-weight:800; color:var(--text); outline:none;
    text-align:center; -webkit-appearance:none;
  }
  .modal input[type=number]:focus{ border-color:var(--primary); background:var(--surface); }
  .quick-vals{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .quick-val-btn{
    background:var(--surface2); border:none; border-radius:12px; padding:10px 4px;
    font-family:'Nunito',sans-serif; font-size:13px; font-weight:800; color:var(--text);
    cursor:pointer;
  }
  .quick-val-btn:active{ transform:scale(.93); }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; border:none; border-radius:14px; padding:15px;
    font-family:'Nunito',sans-serif; font-size:15px; font-weight:800; cursor:pointer;
  }
  .btn-cancel{ background:var(--surface2); color:var(--text-muted); }
  .btn-confirm{ color:#fff; }
  .btn-confirm.eat{ background:var(--orange); }
  .btn-confirm.burn{ background:var(--primary); }

  .toast{
    position:fixed; left:50%; bottom:calc(24px + var(--safe-bottom));
    transform:translate(-50%,20px); background:var(--text); color:#fff;
    padding:12px 20px; border-radius:99px; font-size:13px; font-weight:700;
    opacity:0; transition:all .3s; z-index:300; pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div class="header">
  <div class="header-greeting" id="greeting">Bonjour 👋</div>
  <h1 id="dateLabel">Aujourd'hui</h1>
</div>

<!-- Ring: net calories -->
<div class="card">
  <div class="ring-wrap">
    <div class="ring-container">
      <svg class="ring-svg" viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="84"></circle>
        <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="84" stroke-dasharray="527.8" stroke-dashoffset="527.8"></circle>
      </svg>
      <div class="ring-center">
        <div class="ring-value" id="ringValue">0</div>
        <div class="ring-label">Bilan net (kcal)</div>
      </div>
    </div>
  </div>
  <div class="cal-breakdown">
    <div class="cal-break">
      <div class="cal-break-label">🍽️ Mangé</div>
      <div class="cal-break-value eaten" id="eatenTotal">0</div>
    </div>
    <div class="cal-break">
      <div class="cal-break-label">🔥 Brûlé</div>
      <div class="cal-break-value burned" id="burnedTotal">0</div>
    </div>
  </div>
</div>

<!-- Add buttons -->
<div class="add-grid">
  <button class="add-btn eat" onclick="openModal('eat')">
    <span class="ic">🍽️</span> Calories mangées
  </button>
  <button class="add-btn burn" onclick="openModal('burn')">
    <span class="ic">🔥</span> Calories brûlées
  </button>
</div>

<!-- Motivation -->
<div class="card motiv-card">
  <div class="motiv-emoji" id="motivEmoji">✨</div>
  <div>
    <div class="motiv-text" id="motivText">Ajoute ta première entrée pour démarrer !</div>
    <div class="motiv-sub" id="motivSub"></div>
  </div>
</div>

<!-- Week overview -->
<div class="card">
  <div class="card-head">
    <div class="card-title">Ta semaine</div>
  </div>
  <div class="week-row" id="weekRow"></div>
</div>

<!-- Entries -->
<div class="card">
  <div class="card-head">
    <div class="card-title">Aujourd'hui</div>
  </div>
  <div id="entriesList"></div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Calories mangées</div>
    <div class="modal-sub" id="modalSub">Entre le nombre de kcal</div>
    <input type="number" id="modalInput" inputmode="numeric" placeholder="0" autofocus>
    <div class="quick-vals" id="quickVals"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn btn-confirm" id="modalConfirmBtn" onclick="confirmAdd()">Ajouter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'suiviCaloriesSimple';
let state = { days: {} }; // { "2026-09-27": { eat:[{cal,time}], burn:[{cal,time}] } }
let modalMode = 'eat';

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){}
  if(!state.days) state.days = {};
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function todayKey(d = new Date()){
  return d.toISOString().slice(0,10);
}
function dayData(key){
  if(!state.days[key]) state.days[key] = { eat:[], burn:[] };
  return state.days[key];
}

function init(){
  load();
  renderHeader();
  renderAll();
}

function renderHeader(){
  const h = new Date().getHours();
  const g = h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
  document.getElementById('greeting').textContent = g + ' 👋';
  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}

function renderAll(){
  renderRing();
  renderMotivation();
  renderWeek();
  renderEntries();
}

function sumCal(list){ return list.reduce((s,e)=>s+e.cal,0); }

function renderRing(){
  const d = dayData(todayKey());
  const eaten = sumCal(d.eat);
  const burned = sumCal(d.burn);
  const net = eaten - burned;

  document.getElementById('eatenTotal').textContent = eaten;
  document.getElementById('burnedTotal').textContent = burned;
  document.getElementById('ringValue').textContent = (net>0?'+':'') + net;

  const circumference = 527.8;
  const ref = 2000; // référence visuelle pour remplir l'anneau
  const ratio = Math.min(Math.abs(net) / ref, 1);
  const offset = circumference - (ratio * circumference);
  const fill = document.getElementById('ringFill');
  fill.style.strokeDashoffset = offset;
  fill.classList.toggle('over', net > 0);
}

function renderMotivation(){
  const d = dayData(todayKey());
  const eaten = sumCal(d.eat);
  const burned = sumCal(d.burn);
  const hasEntry = d.eat.length + d.burn.length > 0;
  const streak = computeStreak();

  const emojiEl = document.getElementById('motivEmoji');
  const textEl = document.getElementById('motivText');
  const subEl = document.getElementById('motivSub');

  if(!hasEntry){
    emojiEl.textContent = '✨';
    textEl.textContent = "Ajoute ta première entrée pour démarrer !";
    subEl.textContent = '';
    return;
  }

  const net = eaten - burned;
  if(burned > 0 && net <= 0){
    emojiEl.textContent = '🚀';
    textEl.textContent = 'Bilan négatif aujourd\'hui, bravo pour l\'effort !';
  } else if(burned >= 200){
    emojiEl.textContent = '💪';
    textEl.textContent = 'Belle dépense calorique aujourd\'hui !';
  } else {
    emojiEl.textContent = '👍';
    textEl.textContent = 'Continue à suivre, chaque entrée compte.';
  }
  subEl.textContent = streak >= 2 ? `🔥 ${streak} jours de suivi d'affilée` : 'Reviens demain pour lancer ta série !';
}

function computeStreak(){
  let streak = 0;
  let d = new Date();
  while(true){
    const key = todayKey(d);
    const day = state.days[key];
    const hasEntry = day && (day.eat.length + day.burn.length) > 0;
    if(!hasEntry) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function renderWeek(){
  const row = document.getElementById('weekRow');
  row.innerHTML = '';
  const labels = ['L','M','M','J','V','S','D'];
  const today = new Date();
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    days.push(d);
  }
  const nets = days.map(d=>{
    const key = todayKey(d);
    const day = state.days[key];
    if(!day) return null;
    return sumCal(day.eat) - sumCal(day.burn);
  });
  const maxAbs = Math.max(500, ...nets.map(n=>n===null?0:Math.abs(n)));

  days.forEach((d,i)=>{
    const net = nets[i];
    const col = document.createElement('div');
    col.className = 'week-col';
    const bar = document.createElement('div');
    let h = 4;
    let cls = 'week-bar';
    if(net !== null){
      h = Math.max(6, (Math.abs(net)/maxAbs) * 64);
      cls += net <= 0 ? ' pos' : ' neg';
    }
    const isToday = todayKey(d) === todayKey();
    if(isToday) cls += ' today';
    bar.className = cls;
    bar.style.height = h + 'px';
    const lbl = document.createElement('div');
    lbl.className = 'week-lbl';
    lbl.textContent = labels[(d.getDay()+6)%7];
    col.appendChild(bar);
    col.appendChild(lbl);
    row.appendChild(col);
  });
}

function renderEntries(){
  const d = dayData(todayKey());
  const all = [
    ...d.eat.map((e,i)=>({...e, type:'eat', idx:i})),
    ...d.burn.map((e,i)=>({...e, type:'burn', idx:i}))
  ].sort((a,b)=> (b.ts||0) - (a.ts||0));

  const list = document.getElementById('entriesList');
  if(all.length === 0){
    list.innerHTML = '<div class="empty-state">Aucune entrée pour l\'instant</div>';
    return;
  }
  list.innerHTML = all.map(e => `
    <div class="entry">
      <div class="entry-ic ${e.type}">${e.type==='eat' ? '🍽️' : '🔥'}</div>
      <div class="entry-mid">
        <div class="entry-title">${e.type==='eat' ? 'Repas / collation' : 'Activité'}</div>
        <div class="entry-time">${e.time}</div>
      </div>
      <div class="entry-cal ${e.type}">${e.type==='eat'?'+':'-'}${e.cal}</div>
      <button class="entry-del" onclick="deleteEntry('${e.type}', ${e.idx})">✕</button>
    </div>
  `).join('');
}

function deleteEntry(type, idx){
  const d = dayData(todayKey());
  d[type].splice(idx, 1);
  save();
  renderAll();
}

// Modal
function openModal(mode){
  modalMode = mode;
  const isEat = mode === 'eat';
  document.getElementById('modalTitle').textContent = isEat ? 'Calories mangées' : 'Calories brûlées';
  document.getElementById('modalSub').textContent = isEat ? 'Entre le nombre de kcal consommées' : 'Entre le nombre de kcal brûlées';
  const input = document.getElementById('modalInput');
  input.value = '';
  const quickWrap = document.getElementById('quickVals');
  const quickValues = isEat ? [200, 400, 600, 800] : [100, 200, 300, 500];
  quickWrap.innerHTML = quickValues.map(v => `<button class="quick-val-btn" onclick="setModalVal(${v})">${v}</button>`).join('');
  const confirmBtn = document.getElementById('modalConfirmBtn');
  confirmBtn.className = 'btn btn-confirm ' + mode;
  document.getElementById('modalBg').classList.add('show');
  setTimeout(()=>input.focus(), 200);
}
function setModalVal(v){
  document.getElementById('modalInput').value = v;
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
}
function confirmAdd(){
  const val = parseInt(document.getElementById('modalInput').value);
  if(!val || val <= 0){
    showToast('Entre un nombre valide');
    return;
  }
  const d = dayData(todayKey());
  d[modalMode].push({
    cal: val,
    time: new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}),
    ts: Date.now()
  });
  save();
  closeModal();
  renderAll();
  showToast(modalMode==='eat' ? `🍽️ +${val} kcal ajoutées` : `🔥 -${val} kcal brûlées`);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
